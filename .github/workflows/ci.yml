name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
  EnableRepositorySourceLink: true
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore azure-functions-dotnet-worker-test-server.slnx

      - name: Build
        run: dotnet build azure-functions-dotnet-worker-test-server.slnx --configuration Release --no-restore

      - name: Test fast suites
        run: dotnet test test/AzureFunctionsDotNetWorkerTestServer.Tests/AzureFunctionsDotNetWorkerTestServer.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack azure-functions-dotnet-worker-test-server.slnx --configuration Release --no-build
          --output artifacts/packages
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Validate package artifacts
        shell: pwsh
        run: >-
          ./eng/Verify-Packages.ps1 -PackageDirectory artifacts/packages
          -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Test fast suites
        run: dotnet test test/AzureFunctionsDotNetWorkerTestServer.Tests/AzureFunctionsDotNetWorkerTestServer.Tests.csproj --configuration Release --filter "Speed=Fast"

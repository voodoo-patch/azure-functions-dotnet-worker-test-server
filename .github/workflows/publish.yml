name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: false
  EnableRepositorySourceLink: true
  TZ: UTC
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Derive package version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must use v<semantic-version>, for example v0.1.0." >&2
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore azure-functions-dotnet-worker-test-server.slnx

      - name: Build
        run: dotnet build azure-functions-dotnet-worker-test-server.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test test/Worker.TestServer.Tests/Worker.TestServer.Tests.csproj --configuration Release --no-build

      - name: Pack
        run: >-
          dotnet pack azure-functions-dotnet-worker-test-server.slnx --configuration Release --no-build
          --output artifacts/packages
          -p:Version=${{ steps.version.outputs.value }}
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}

      - name: Validate package artifacts
        shell: pwsh
        run: >-
          ./eng/Verify-Packages.ps1 -PackageDirectory artifacts/packages
          -RepositoryUrl "${{ github.server_url }}/${{ github.repository }}"
          -PackageVersion "${{ steps.version.outputs.value }}"

      - name: Publish
        run: >-
          dotnet nuget push artifacts/packages/*.nupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
